apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: app
        image: mohameds2/page:latest  
        imagePullPolicy: Always 
        ports:
        - containerPort: 80
